# nginx/hub.conf — Orbital Hub nginx reverse proxy configuration.
#
# Round 7-07 — Hub Deployment + Operations
# [Engineer-Sr · Sonnet · run-round7-07-hub-deploy-ops]
#
# Features:
#   - HTTP (80) → HTTPS (443) redirect
#   - TLS termination using cert/key from /etc/nginx/certs/
#   - WebSocket upgrade pass-through for /ws and /trpc WebSocket transport
#   - Rate limiting: 20 req/s per IP (burst 40) for API; 5 req/s for auth routes
#   - Upstream keepalive connection pooling to the hub process
#   - Security headers (HSTS, X-Frame-Options, X-Content-Type-Options)
#   - Gzip compression for JSON/text responses

# ---------------------------------------------------------------------------
# Upstream — Orbital Hub service (Fastify on port 4000 inside Docker)
# ---------------------------------------------------------------------------
upstream orbital_hub {
    server orbital-hub:4000;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# Rate limit zones
# ---------------------------------------------------------------------------
# General API limit: 20 requests/second per IP, burst of 40
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# Auth routes (join, register): stricter — 5 req/s per IP
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# WebSocket connections: 10 concurrent upgrades per IP
limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

# ---------------------------------------------------------------------------
# HTTP server — redirect all traffic to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME challenge (Let's Encrypt renewal) — serve from webroot before redirect
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }

    # Health check on port 80 for container health probes (no TLS required)
    location = /health {
        proxy_pass http://orbital_hub;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS server — main reverse proxy
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # ---- TLS configuration ----
    # Mount a directory containing cert.pem and key.pem.
    # For self-signed: openssl req -x509 -newkey rsa:4096 -keyout key.pem -out cert.pem -days 365 -nodes
    # For Let's Encrypt: use certbot --nginx or mount /etc/letsencrypt/live/<domain>/
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling (requires resolver and a CA-signed cert)
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # resolver 1.1.1.1 1.0.0.1 valid=300s;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # ---- Gzip compression ----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml;

    # ---- Client limits ----
    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;

    # ---- WebSocket upgrade — /ws path ----
    location /ws {
        limit_conn ws_conn 10;

        proxy_pass http://orbital_hub;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Long timeout for persistent WS connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Disable buffering for real-time streaming
        proxy_buffering off;
    }

    # ---- tRPC WebSocket transport (subscriptions) ----
    location /trpc {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://orbital_hub;
        proxy_http_version 1.1;

        # WebSocket upgrade support (tRPC subscriptions use WS)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # ---- Auth / join routes — stricter rate limit ----
    location ~ ^/(join|api/v1/auth) {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://orbital_hub;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ---- All other routes ----
    location / {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://orbital_hub;
        proxy_http_version 1.1;
        proxy_set_header Connection "";  # Enable keepalive to upstream
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;

        # Buffer responses for latency hiding
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
