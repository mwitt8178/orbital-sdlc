services:
  postgres:
    image: postgres:16-alpine
    container_name: orbital-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orbital
      POSTGRES_PASSWORD: orbital_dev_password
      POSTGRES_DB: orbital
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=4
      - -c
      - wal_keep_size=128
      - -c
      - archive_mode=on
      - -c
      - archive_command=/bin/true
    volumes:
      - orbital-pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orbital -d orbital']
      interval: 5s
      timeout: 5s
      retries: 10

  pg_receivewal:
    image: postgres:16-alpine
    container_name: orbital-pg-receivewal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: orbital_dev_password
    command:
      - sh
      - -c
      - |
        mkdir -p /wal &&
        until pg_isready -h postgres -U orbital -d orbital; do sleep 1; done &&
        pg_receivewal --host=postgres --username=orbital --directory=/wal --slot=orbital_wal_slot --create-slot --if-not-exists --no-loop --verbose
    volumes:
      - orbital-wal:/wal

volumes:
  orbital-pgdata:
  orbital-wal:
