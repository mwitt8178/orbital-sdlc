# ui-deploy.yml — Build and deploy UI to S3 + CloudFront invalidation
#
# [Engineer-Sr · Sonnet · run-round8-06-s3-cloudfront]
#
# Triggers on push to main when packages/ui/** changes.
# Uses GitHub OIDC to assume an AWS IAM role — no long-lived credentials stored
# in GitHub secrets. The IAM role ARN is environment-specific and provided as a
# GitHub Actions environment variable / secret.
#
# Required GitHub secrets (per-environment):
#   UI_DEPLOY_ROLE_ARN  — ARN of the IAM role to assume via OIDC
#                         e.g. arn:aws:iam::111111111111:role/OrbitalUIDeployRole-mwitt
#                         (role created in 8-01/8-06 CDK stack — see infra/lib/constructs/)
#   AWS_ACCOUNT_ID      — 12-digit AWS account ID for the target environment
#   CF_DIST_ID          — CloudFront distribution ID
#                         (exported from CDK: OrbitalHub-<env>-CloudFrontDistributionId)
#
# Note: GitHub OIDC trust must be configured on the IAM role's trust policy.
# The trust policy should allow AssumeRoleWithWebIdentity from
# token.actions.githubusercontent.com with sub matching the repo + branch.
#
# Example trust policy condition:
#   "StringLike": {
#     "token.actions.githubusercontent.com:sub":
#       "repo:<org>/<repo>:ref:refs/heads/main"
#   }
#
# The IAM role needs the following minimum permissions:
#   s3:PutObject, s3:DeleteObject, s3:ListBucket  on the UI bucket
#   cloudfront:CreateInvalidation                  on the distribution
#
# Role ARN is TBD — operator fills in the secret after CDK deploy outputs the
# OrbitalHub-<env>-CloudFrontDistributionId and bucket name.

name: UI Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'packages/ui/**'
      - '.github/workflows/ui-deploy.yml'

  # Allow manual trigger for re-deploys without a UI change
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'mwitt'
        type: choice
        options:
          - mwitt
          - rreed
          - prod

concurrency:
  group: ui-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write  # Required for GitHub OIDC token
  contents: read

jobs:
  build-and-deploy:
    name: Build UI + Deploy to S3 + Invalidate CloudFront
    runs-on: ubuntu-latest

    # Environment scoping: use GitHub Environments to separate secrets per env.
    # On push to main, deploy to mwitt (dev) env automatically.
    # Manual dispatch allows targeting any env.
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'mwitt' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build UI
        run: npm run build -w packages/ui
        env:
          # Vite uses VITE_* env vars at build time. Pass the API base URL for
          # the target environment. These are not secrets — they are baked into
          # the static JS bundle.
          VITE_API_BASE_URL: https://api.${{ vars.ORBITAL_DOMAIN || 'mwitt.orbital.team.dev' }}
          VITE_WS_BASE_URL: wss://api.${{ vars.ORBITAL_DOMAIN || 'mwitt.orbital.team.dev' }}/ws
          VITE_COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID || '' }}
          VITE_COGNITO_APP_CLIENT_ID: ${{ vars.COGNITO_APP_CLIENT_ID || '' }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.UI_DEPLOY_ROLE_ARN }}
          role-session-name: OrbitalUIDeploySession
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          # role-duration-seconds: 900 (15 minutes — sufficient for S3 sync + CF invalidation)
          role-duration-seconds: 900

      - name: Sync UI dist to S3
        run: |
          # Bucket name from CDK output: OrbitalHub-<env>-UiBucketName
          # Pattern: orbital-ui-<env>-<account>
          BUCKET="orbital-ui-${{ vars.ORBITAL_ENV || 'mwitt' }}-${{ secrets.AWS_ACCOUNT_ID }}"
          echo "Syncing to s3://${BUCKET}"

          # Sync all assets with long cache headers for hashed filenames
          aws s3 sync packages/ui/dist/ "s3://${BUCKET}" \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

          # Sync index.html separately with no-cache headers (SPA entrypoint)
          aws s3 cp packages/ui/dist/index.html "s3://${BUCKET}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          # Only invalidate index.html — hashed assets don't need invalidation
          # (CloudFront serves the cached version until the TTL expires,
          #  but since new filenames are generated by Vite, old files are
          #  unreferenced anyway; only index.html must be invalidated to point
          #  at the new asset filenames).
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CF_DIST_ID }}" \
            --paths "/index.html"

      - name: Verify deployment
        run: |
          DOMAIN="${{ vars.ORBITAL_DOMAIN || 'mwitt.orbital.team.dev' }}"
          echo "Deployment complete. UI available at: https://${DOMAIN}"
          echo "CloudFront distribution: ${{ secrets.CF_DIST_ID }}"
          echo "Note: CloudFront propagation may take up to 5 minutes."
