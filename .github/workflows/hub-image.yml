# .github/workflows/hub-image.yml — Build + publish hub Docker image to GHCR.
#
# Round 7-07 — Hub Deployment + Operations
# [Engineer-Sr · Sonnet · run-round7-07-hub-deploy-ops]
#
# Triggers:
#   - Push of a 'v*' semver tag (e.g. v1.0.0, v1.2.3-rc1)
#   - Manual workflow_dispatch (for testing or emergency releases)
#
# Publishes:
#   ghcr.io/<owner>/orbital-hub:<version>
#   ghcr.io/<owner>/orbital-hub:latest   (only on non-pre-release tags)
#
# Requires repository secret:
#   GHCR credentials are provided via GITHUB_TOKEN (auto-provisioned by GitHub).
#   No extra secrets needed for GHCR.

name: Hub Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build + Push Hub Image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ---- Checkout ----
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git describe

      # ---- Compute version ----
      - name: Compute version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          # Strip leading 'v' for package version field
          SEMVER="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"
          # Determine if this is a pre-release (contains - like v1.0.0-rc1)
          if [[ "${SEMVER}" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # ---- QEMU for multi-arch (arm64 + amd64) ----
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      # ---- Buildx for multi-arch builds ----
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---- Login to GHCR ----
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- Compute Docker metadata (tags + labels) ----
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/orbital-hub
          tags: |
            # Exact version tag: v1.0.0 → orbital-hub:1.0.0
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            # Major.minor: v1.0.0 → orbital-hub:1.0
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            # 'latest' only for stable releases (no pre-release suffix)
            type=raw,value=latest,enable=${{ steps.version.outputs.is_prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=orbital-hub
            org.opencontainers.image.description=Orbital Hub — centralized multi-operator collaboration server
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.semver }}
            org.opencontainers.image.revision=${{ github.sha }}

      # ---- Build + push ----
      - name: Build and push hub image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.hub
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.semver }}

      # ---- Validate: pull and run health check on amd64 ----
      - name: Smoke test — pull and health check
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/orbital-hub:${{ steps.version.outputs.semver }}"
          docker pull "${IMAGE}"
          # Start with a dummy DB URL — we only check the image starts and prints usage
          docker run --rm \
            -e ORBITAL_MODE=hub \
            -e DATABASE_URL="postgres://orbital:test@localhost:5432/orbital_hub" \
            -e ORBITAL_HUB_MASTER_KEY="$(openssl rand -hex 32)" \
            -e NODE_ENV=production \
            --entrypoint sh \
            "${IMAGE}" \
            -c "node packages/orchestrator/dist/index.js --version 2>&1 || echo 'image_ok'"

      # ---- Output summary ----
      - name: Job summary
        run: |
          echo "## Hub Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Platforms:** linux/amd64, linux/arm64" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tags published:**" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
