# docker-compose.hub.yml — Production self-host stack for the Orbital Hub.
#
# Round 7-07 — Hub Deployment + Operations (extends Round 7-01 scaffold)
# [Engineer-Sr · Sonnet · run-round7-07-hub-deploy-ops]
#
# Usage:
#   # First-time bootstrap (generates master key + env block):
#   bash scripts/hub-bootstrap.sh
#
#   # Start the full stack:
#   docker compose -f docker-compose.hub.yml up -d
#
#   # Tail logs:
#   docker compose -f docker-compose.hub.yml logs -f
#
# Required env vars (set in .env or export before running):
#   ORBITAL_HUB_MASTER_KEY   — 64-char hex key (from hub-bootstrap.sh)
#   HUB_POSTGRES_PASSWORD    — Postgres password (auto-generated by bootstrap)
#   ORBITAL_HOSTNAME         — public hostname, e.g. orbital.team.dev
#
# Optional env vars:
#   ORBITAL_PORT             — default 4000
#   HUB_POSTGRES_PORT        — host-side Postgres port, default 5433
#   LOG_LEVEL                — default warn
#   ORBITAL_HUB_TENANT_ID    — default tenant UUID (from bootstrap)

services:
  # ---------------------------------------------------------------------------
  # Hub Postgres — dedicated Postgres 16, separate from dev local compose
  # ---------------------------------------------------------------------------
  hub-postgres:
    image: postgres:16-alpine
    container_name: orbital-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orbital
      POSTGRES_PASSWORD: ${HUB_POSTGRES_PASSWORD:?HUB_POSTGRES_PASSWORD must be set — run scripts/hub-bootstrap.sh}
      POSTGRES_DB: orbital_hub
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=4
      - -c
      - wal_keep_size=128
      - -c
      - log_connections=on
      - -c
      - log_min_duration_statement=1000
    volumes:
      - hub-pgdata:/var/lib/postgresql/data
    ports:
      - '${HUB_POSTGRES_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orbital -d orbital_hub']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - orbital-internal

  # ---------------------------------------------------------------------------
  # Orbital Hub Service
  # ---------------------------------------------------------------------------
  orbital-hub:
    build:
      context: .
      dockerfile: Dockerfile.hub
    image: ${HUB_IMAGE:-ghcr.io/orbital-oss/orbital-hub:latest}
    container_name: orbital-hub
    restart: unless-stopped
    depends_on:
      hub-postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # ORBITAL_MODE=hub is baked into the Dockerfile ENV; explicit here for
      # grep-ability and to make override easy if ever needed.
      ORBITAL_MODE: hub
      ORBITAL_PORT: ${ORBITAL_PORT:-4000}
      DATABASE_URL: postgres://orbital:${HUB_POSTGRES_PASSWORD}@hub-postgres:5432/orbital_hub
      # Master key — MUST be set before starting; use hub-bootstrap.sh to generate.
      ORBITAL_HUB_MASTER_KEY: ${ORBITAL_HUB_MASTER_KEY:?ORBITAL_HUB_MASTER_KEY must be set — run scripts/hub-bootstrap.sh}
      # Default tenant UUID for the initial owner installation.
      ORBITAL_HUB_TENANT_ID: ${ORBITAL_HUB_TENANT_ID:-00000000-0000-0000-0000-000000000000}
      # Public hostname used in invite URLs and CORS origin.
      ORBITAL_HOSTNAME: ${ORBITAL_HOSTNAME:-localhost}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      # CORS: allow the nginx-proxied frontend to call the API.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://${ORBITAL_HOSTNAME:-localhost}}
    ports:
      # Only exposed to internal network; nginx terminates TLS and proxies here.
      - '${ORBITAL_PORT:-4000}:${ORBITAL_PORT:-4000}'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:${ORBITAL_PORT:-4000}/health || exit 1']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    volumes:
      - orbital-hub-data:/var/run/orbital
    networks:
      - orbital-internal
      - orbital-external

  # ---------------------------------------------------------------------------
  # nginx — TLS termination, HTTP→HTTPS redirect, WebSocket proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: orbital-hub-nginx
    restart: unless-stopped
    depends_on:
      orbital-hub:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/hub.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS certificates — mount a directory containing cert.pem + key.pem.
      # For a quick self-signed cert: see docs/hub-deployment.md §TLS.
      # For Let's Encrypt: mount /etc/letsencrypt/live/<domain>/ here.
      - ${TLS_CERT_DIR:-./nginx/certs}:/etc/nginx/certs:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost/health || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - orbital-external

# ---------------------------------------------------------------------------
# Named volumes
# ---------------------------------------------------------------------------
volumes:
  hub-pgdata:
    driver: local
  orbital-hub-data:
    driver: local

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  # Hub <-> Postgres communication — not exposed outside Docker
  orbital-internal:
    driver: bridge
    internal: true
  # nginx <-> hub communication — nginx has external access
  orbital-external:
    driver: bridge
